name: Unified Keep-Alive Bot (Career OS & NutriTrack)

on:
  schedule:
    # Run every 14 minutes to prevent Render's 15-minute free tier spin-down
    - cron: '*/14 * * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Career OS & NutriTrack
    runs-on: ubuntu-latest
    steps:
      - name: Ping Career OS Backend & Supabase
        run: |
          echo "=== Pinging Career OS ==="
          RESP_CAREER=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s\n" \
            --max-time 60 \
            "https://career-os-backend-i375.onrender.com/api/health?ping_db=true")
          echo "$RESP_CAREER"

      - name: Ping NutriTrack Backend & Supabase
        run: |
          echo "=== Pinging NutriTrack ==="
          RESP_NUTRI=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s\n" \
            --max-time 60 \
            "https://nutritrack-k96f.onrender.com/api/health")
          echo "$RESP_NUTRI"
