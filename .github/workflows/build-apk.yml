name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Build Web Assets
        run: |
          cd frontend
          npm install
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        run: |
          cd frontend/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/career-os-debug.apk
          echo "APK generated successfully at dist-apk/career-os-debug.apk"
          ls -lh dist-apk/

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: career-os-apk
          path: dist-apk/career-os-debug.apk
          retention-days: 30

      - name: Create GitHub Release (If tagged or manual release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Career OS Android APK ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ## 📱 Career OS Mobile Release
            Download and install the Android `.apk` directly onto your smartphone or tablet.

            - **File:** `career-os-debug.apk`
            - **Platform:** Android 8.0+
            - **Includes:** AI Resume Matcher, Voice Mock Interview, System Design Whiteboard, Application Kanban, and Peer Practice Room.
          files: dist-apk/career-os-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
